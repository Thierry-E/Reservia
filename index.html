<!DOCTYPE html>
<html lang="fr">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" type="text/css" href="./css/styles.css">
   <!-- Font Raleway-->
   <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,700;0,900&display=swap"
      rel="stylesheet">
   <!-- Fin Font Raleway-->
   <!-- FontAwesome -->
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous" referrerpolicy="no-referrer" />
   <!-- Fin Font Awesome -->
   <title>Reservia</title>
</head>

<body>
   <header>
      <img class="logo" src="./images/logo/Reservia@3x.png" alt="Logo de Reservia">
      <nav>
         <a href="">Hébergements</a>
         <a href="">Activités</a>
         <a class="subscriber" href="">S'inscrire</a>
      </nav>
   </header>
   <main>
      <section class="hero">
         <h1>Trouvez votre hébergement pour des vacances de rêves</h1>
         <span>En plein centre ville ou en pleine nature</span>
         <form>
            <div class="location">
               <i class="fa-solid fa-location-dot"></i>
            </div>
            <input type="search" placeholder="Marseille, France" />
            <button class="btn-search" type="submit">Rechercher</button>
            <button class="btn-search-icon" type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
         </form>
         <div class="filters">
            <span>Filtres</span>
            <div class="filters-container">
               <div class="filters-item">
                  <div class="filters-icon"><i class="fa-solid fa-money-bill-wave"></i></div>
                  <h3>Économique</h3>
               </div>

               <div class="filters-item">
                  <h3>Familial</h3>
                  <div class="filters-icon"><i class="fa-solid fa-child-reaching"></i></div>
               </div>

               <div class="filters-item">
                  <div class="filters-icon"><i class="fa-solid fa-heart"></i></div>
                  <h3>Romantique</h3>
               </div>

               <div class="filters-item">
                  <div class="filters-icon"><i class="fa-solid fa-dog"></i></div>
                  <h3>Animaux autorisés</h3>
               </div>
            </div>
         </div>
      </section>
</body>

</html>
